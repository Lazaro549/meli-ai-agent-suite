[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meli-ai-agent-suite"
version = "0.1.0"
description = "Multi-agent system for Mercado Libre listing optimization, pricing intelligence, and stock alerts using Amazon Bedrock."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lazaro Gomez Vitolo", email = "lazaro.gomez.vitolo@example.com" },
]
keywords = [
    "mercado-libre",
    "ecommerce",
    "langgraph",
    "bedrock",
    "multi-agent",
    "seo",
    "pricing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pydantic",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=0.2.55",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.34.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
meli-ai = "src.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
